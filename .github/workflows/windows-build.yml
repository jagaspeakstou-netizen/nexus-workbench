# Builds the NEXUS backend + frontend + Windows launcher shell on a real
# windows-latest GitHub Actions runner, runs the C++ unit test suite there,
# launches the packaged Launch.exe on that runner's own desktop session,
# and captures a screenshot of it actually running plus the full build/test
# log as workflow artifacts.
#
# This is the project's source of genuine (not fabricated) Windows 11
# build-and-launch evidence -- see docs/packaging/windows.md for how the
# artifacts from an actual run of this workflow are used in the submission,
# and for what to do if any step here fails (fix and re-run, never hand-edit
# the resulting evidence).

name: windows-build

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  build-and-verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend (Vite production bundle)
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Report vcpkg location (pre-installed on windows-latest)
        run: |
          echo "VCPKG_INSTALLATION_ROOT=$env:VCPKG_INSTALLATION_ROOT"
          dir "$env:VCPKG_INSTALLATION_ROOT"

      - name: Configure CMake (Release, vcpkg manifest mode, WIN32 launcher target included)
        working-directory: backend
        run: >
          cmake -S . -B build -A x64
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
        # No -G: the first real CI run (2026-11-01, run #1) failed with
        # "could not find any instance of Visual Studio" against a
        # hardcoded "Visual Studio 17 2022" generator name -- the actual
        # vcpkg compiler-detection log in that same run showed the
        # installed toolset under ".../Visual Studio/18/Enterprise/...",
        # i.e. this windows-latest image had moved to a VS major version
        # this generator string doesn't match. Letting CMake pick the
        # default (newest installed) Visual Studio generator avoids
        # hardcoding a version number against a runner image that changes
        # over time. -A x64 is kept explicit since the default platform
        # for a VS generator is Win32, not x64.

      - name: Build (backend + nexus_launcher / Launch.exe)
        working-directory: backend
        run: cmake --build build --config Release --parallel

      - name: Run C++ unit tests (ctest) on Windows
        working-directory: backend
        run: ctest --test-dir build -C Release --output-on-failure
        # Intentionally NOT continue-on-error: a real test failure on
        # Windows must fail this workflow, not be hidden from the evidence.

      - name: Locate the packaged application folder
        id: locate
        working-directory: backend
        run: |
          $launchExe = Get-ChildItem -Path build -Recurse -Filter "Launch.exe" | Select-Object -First 1
          if (-not $launchExe) { throw "Launch.exe was not produced by the build." }
          echo "app_dir=$($launchExe.DirectoryName)" >> $env:GITHUB_OUTPUT
          echo "Launch.exe found at: $($launchExe.FullName)"
          Get-ChildItem $launchExe.DirectoryName

      - name: Ensure the WebView2 Runtime is present (matches real Windows 11 client default)
        shell: powershell
        run: |
          # A 2026-11-01 run's Launch.exe showed a WebView2 startup-error
          # dialog (ShowWebView2MissingError()), which the old
          # process-alive-only verification step below did not catch. The
          # original theory here was that windows-latest (a Windows SERVER
          # image, confirmed by that run's own screenshot watermark) simply
          # lacks the WebView2 Runtime Windows 11 client ships by default --
          # but a follow-up run on 2026-11-02 showed the Runtime WAS already
          # present (v155.0.4283.62) and the SAME startup error still
          # occurred, so that was not the (whole) root cause. This step is
          # kept as cheap, harmless insurance (it's a no-op when the runtime
          # is already present, as it usually is here), but the actual fix
          # for the real root cause is the HRESULT logging added to
          # Launcher.cpp (LogStartupFailure -> launcher_error.log) plus the
          # hardened window-detection below -- see AI_USE_LOG.md Item 8 for
          # the full, honest account of this investigation as it unfolded.
          $existing = Get-ItemProperty "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\*" -ErrorAction SilentlyContinue |
            Where-Object { $_.pv -and $_.PSChildName -eq "{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}" }
          if ($existing) {
            Write-Host "WebView2 Runtime already present (version $($existing.pv)) -- no install needed."
          } else {
            Write-Host "WebView2 Runtime not found on this runner image -- installing the Evergreen bootstrapper (the same one Launch.exe's own error dialog points a user to)."
            Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile "$env:TEMP\MicrosoftEdgeWebview2Setup.exe"
            $install = Start-Process -FilePath "$env:TEMP\MicrosoftEdgeWebview2Setup.exe" -ArgumentList "/silent", "/install" -Wait -PassThru
            if ($install.ExitCode -ne 0) {
              throw "WebView2 Runtime installer exited with code $($install.ExitCode)."
            }
            Write-Host "WebView2 Runtime installed."
          }

      - name: Launch the packaged app and capture a screenshot
        shell: powershell
        run: |
          $appDir = "${{ steps.locate.outputs.app_dir }}"
          $proc = Start-Process -FilePath "$appDir\Launch.exe" -PassThru
          Start-Sleep -Seconds 6

          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          # 2026-11-02: an earlier version of this check used FindWindow with
          # a hardcoded exact title string, including a guessed em-dash
          # variant -- and it silently failed to match the real window (whose
          # title was itself garbled by an unrelated MSVC source-encoding bug,
          # since fixed in Launcher.cpp/CMakeLists.txt), so a real startup
          # failure was reported as a pass. Enumerating all top-level windows
          # and checking for the SUBSTRING "Startup Error" is robust against
          # exact-title mismatches (encoding, punctuation, future wording
          # changes) in a way a single exact FindWindow call is not.
          $win32TypeDef = 'using System; using System.Text; using System.Collections.Generic; using System.Runtime.InteropServices; public class Win32 { public delegate bool EnumWindowsProc(IntPtr hWnd, IntPtr lParam); [DllImport("user32.dll")] public static extern bool EnumWindows(EnumWindowsProc lpEnumFunc, IntPtr lParam); [DllImport("user32.dll")] public static extern int GetWindowTextLength(IntPtr hWnd); [DllImport("user32.dll")] public static extern int GetWindowText(IntPtr hWnd, StringBuilder lpString, int nMaxCount); public static List<string> GetAllWindowTitles() { var titles = new List<string>(); EnumWindows((hWnd, lParam) => { int len = GetWindowTextLength(hWnd); if (len > 0) { var sb = new StringBuilder(len + 1); GetWindowText(hWnd, sb, sb.Capacity); titles.Add(sb.ToString()); } return true; }, IntPtr.Zero); return titles; } }'
          Add-Type -TypeDefinition $win32TypeDef

          $stillRunning = -not $proc.HasExited
          "Launch.exe still running after 6s: $stillRunning" | Out-File launch_status.txt
          Get-Process -Id $proc.Id -ErrorAction SilentlyContinue | Format-List * | Out-File -Append launch_status.txt
          Write-Host "Launch.exe still running after 6s: $stillRunning"

          $allTitles = [Win32]::GetAllWindowTitles()
          "All top-level window titles at screenshot time:" | Out-File -Append launch_status.txt
          $allTitles | Out-File -Append launch_status.txt
          $startupErrorShown = ($allTitles | Where-Object { $_ -match "Startup Error" }).Count -gt 0
          "Startup error dialog detected (substring match): $startupErrorShown" | Out-File -Append launch_status.txt
          Write-Host "All top-level window titles: $($allTitles -join ' | ')"
          Write-Host "Startup error dialog detected (substring match): $startupErrorShown"

          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $bitmap.Save("$env:GITHUB_WORKSPACE\windows_launch_screenshot.png")

          if (-not $stillRunning) {
            throw "Launch.exe exited within 6 seconds of starting -- treating this as a launch failure, not capturing it as success."
          }
          # Launcher.cpp's LogStartupFailure() writes a real HRESULT + error
          # message to launcher_error.log beside Launch.exe on any WebView2
          # init failure -- copy it out and inline it here so it's visible
          # without having to download and unzip the full app package.
          $errorLogPath = Join-Path $appDir "launcher_error.log"
          if (Test-Path $errorLogPath) {
            Copy-Item $errorLogPath "$env:GITHUB_WORKSPACE\launcher_error.log"
            "--- launcher_error.log ---" | Out-File -Append launch_status.txt
            Get-Content $errorLogPath | Out-File -Append launch_status.txt
            # Also echo to the step's own stdout (Write-Host), not just the
            # artifact file -- a 2026-11-02 run showed this content only
            # going to Out-File, which this project's own dev environment
            # cannot read back (artifact downloads are blocked here, but the
            # workflow's text log is not), so the real HRESULT was invisible
            # without yet another round of asking a human to check a file.
            Write-Host "--- launcher_error.log content ---"
            Get-Content $errorLogPath | Write-Host
            Write-Host "--- end launcher_error.log ---"
          } else {
            Write-Host "No launcher_error.log was written (no WebView2 init failure occurred, or Launch.exe could not write to its own directory)."
          }

          if ($startupErrorShown) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            throw "Launch.exe is running but showing its own 'Startup Error' dialog (see windows_launch_screenshot.png and launcher_error.log) -- treating this as a launch failure, not capturing it as success. A process that is merely 'responding' is not the same as a successful launch."
          }

          Stop-Process -Id $proc.Id -Force

      - name: Package the application folder as a zip
        # Always runs, even if the launch-verification step above failed, so
        # a real failure still produces its own screenshot/log evidence for
        # debugging instead of silently vanishing -- the project's own
        # disclose-don't-hide policy applies to CI tooling too.
        if: always()
        shell: powershell
        run: |
          $appDir = "${{ steps.locate.outputs.app_dir }}"
          Compress-Archive -Path "$appDir\*" -DestinationPath "$env:GITHUB_WORKSPACE\NEXUS_Windows_x64.zip" -Force

      - name: Upload Windows build/launch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-windows-evidence
          path: |
            windows_launch_screenshot.png
            launch_status.txt
            launcher_error.log
            NEXUS_Windows_x64.zip
          if-no-files-found: warn
