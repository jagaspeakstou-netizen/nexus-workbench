# Builds the NEXUS backend + frontend + Windows launcher shell on a real
# windows-latest GitHub Actions runner, runs the C++ unit test suite there,
# launches the packaged Launch.exe on that runner's own desktop session,
# and captures a screenshot of it actually running plus the full build/test
# log as workflow artifacts.
#
# This is the project's source of genuine (not fabricated) Windows 11
# build-and-launch evidence -- see docs/packaging/windows.md for how the
# artifacts from an actual run of this workflow are used in the submission,
# and for what to do if any step here fails (fix and re-run, never hand-edit
# the resulting evidence).

name: windows-build

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  build-and-verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend (Vite production bundle)
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Report vcpkg location (pre-installed on windows-latest)
        run: |
          echo "VCPKG_INSTALLATION_ROOT=$env:VCPKG_INSTALLATION_ROOT"
          dir "$env:VCPKG_INSTALLATION_ROOT"

      - name: Configure CMake (Release, vcpkg manifest mode, WIN32 launcher target included)
        working-directory: backend
        run: >
          cmake -S . -B build -A x64
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
        # No -G: the first real CI run (2026-11-01, run #1) failed with
        # "could not find any instance of Visual Studio" against a
        # hardcoded "Visual Studio 17 2022" generator name -- the actual
        # vcpkg compiler-detection log in that same run showed the
        # installed toolset under ".../Visual Studio/18/Enterprise/...",
        # i.e. this windows-latest image had moved to a VS major version
        # this generator string doesn't match. Letting CMake pick the
        # default (newest installed) Visual Studio generator avoids
        # hardcoding a version number against a runner image that changes
        # over time. -A x64 is kept explicit since the default platform
        # for a VS generator is Win32, not x64.

      - name: Build (backend + nexus_launcher / Launch.exe)
        working-directory: backend
        run: cmake --build build --config Release --parallel

      - name: Run C++ unit tests (ctest) on Windows
        working-directory: backend
        run: ctest --test-dir build -C Release --output-on-failure
        # Intentionally NOT continue-on-error: a real test failure on
        # Windows must fail this workflow, not be hidden from the evidence.

      - name: Locate the packaged application folder
        id: locate
        working-directory: backend
        run: |
          $launchExe = Get-ChildItem -Path build -Recurse -Filter "Launch.exe" | Select-Object -First 1
          if (-not $launchExe) { throw "Launch.exe was not produced by the build." }
          echo "app_dir=$($launchExe.DirectoryName)" >> $env:GITHUB_OUTPUT
          echo "Launch.exe found at: $($launchExe.FullName)"
          Get-ChildItem $launchExe.DirectoryName

      - name: Ensure the WebView2 Runtime is present (matches real Windows 11 client default)
        shell: powershell
        run: |
          # windows-latest is a Windows SERVER image (confirmed by a prior
          # run's own captured screenshot watermark: "Windows Server 2025
          # Datacenter"), not literal Windows 11 client. Microsoft's "WebView2
          # Runtime ships by default" guarantee is specifically for Windows 11
          # client -- Server does not include it, so a prior run's Launch.exe
          # actually hit ShowWebView2MissingError() and showed a startup-error
          # dialog, which the old (process-alive-only) verification step below
          # did not catch, since a modal dialog's message loop still counts as
          # "responding." This step installs the same Evergreen runtime a real
          # Windows 11 client already ships with, so this runner is a true
          # proxy for the target platform again -- it is NOT papering over the
          # defect, it's fixing the CI environment to match what the brief
          # actually targets (Windows 11 x64); the verification step below is
          # also hardened to catch this class of failure if it recurs.
          $existing = Get-ItemProperty "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\*" -ErrorAction SilentlyContinue |
            Where-Object { $_.pv -and $_.PSChildName -eq "{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}" }
          if ($existing) {
            Write-Host "WebView2 Runtime already present (version $($existing.pv)) -- no install needed."
          } else {
            Write-Host "WebView2 Runtime not found on this runner image -- installing the Evergreen bootstrapper (the same one Launch.exe's own error dialog points a user to)."
            Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile "$env:TEMP\MicrosoftEdgeWebview2Setup.exe"
            $install = Start-Process -FilePath "$env:TEMP\MicrosoftEdgeWebview2Setup.exe" -ArgumentList "/silent", "/install" -Wait -PassThru
            if ($install.ExitCode -ne 0) {
              throw "WebView2 Runtime installer exited with code $($install.ExitCode)."
            }
            Write-Host "WebView2 Runtime installed."
          }

      - name: Launch the packaged app and capture a screenshot
        shell: powershell
        run: |
          $appDir = "${{ steps.locate.outputs.app_dir }}"
          $proc = Start-Process -FilePath "$appDir\Launch.exe" -PassThru
          Start-Sleep -Seconds 6

          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          $win32TypeDef = 'using System; using System.Runtime.InteropServices; public class Win32 { [DllImport("user32.dll", SetLastError = true, CharSet = CharSet.Auto)] public static extern IntPtr FindWindow(string lpClassName, string lpWindowName); }'
          Add-Type -TypeDefinition $win32TypeDef

          $stillRunning = -not $proc.HasExited
          "Launch.exe still running after 6s: $stillRunning" | Out-File launch_status.txt
          Get-Process -Id $proc.Id -ErrorAction SilentlyContinue | Format-List * | Out-File -Append launch_status.txt

          # A WebView2-missing (or any other) startup failure shows a modal
          # MessageBox titled "NEXUS - Startup Error" (ShowWebView2MissingError()
          # in Launcher.cpp). That dialog's own message loop keeps pumping, so
          # $proc.HasExited alone is NOT sufficient to detect this failure mode
          # -- it was exactly this gap that let a real startup failure get
          # reported as "confirmed running" in an earlier run. Explicitly look
          # for that window (both hyphen and en-dash variants, since the title
          # uses an en-dash) and fail loudly if it's present.
          $emDashTitle = "NEXUS " + [char]0x2014 + " Startup Error"
          $errorDialogHandle = [Win32]::FindWindow($null, $emDashTitle)
          if ($errorDialogHandle -eq [IntPtr]::Zero) {
            $errorDialogHandle = [Win32]::FindWindow($null, "NEXUS - Startup Error")
          }
          $startupErrorShown = $errorDialogHandle -ne [IntPtr]::Zero
          "Startup error dialog detected: $startupErrorShown" | Out-File -Append launch_status.txt

          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $bitmap.Save("$env:GITHUB_WORKSPACE\windows_launch_screenshot.png")

          if (-not $stillRunning) {
            throw "Launch.exe exited within 6 seconds of starting -- treating this as a launch failure, not capturing it as success."
          }
          if ($startupErrorShown) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            throw "Launch.exe is running but showing its own 'Startup Error' dialog (see windows_launch_screenshot.png) -- treating this as a launch failure, not capturing it as success. A process that is merely 'responding' is not the same as a successful launch."
          }

          Stop-Process -Id $proc.Id -Force

      - name: Package the application folder as a zip
        # Always runs, even if the launch-verification step above failed, so
        # a real failure still produces its own screenshot/log evidence for
        # debugging instead of silently vanishing -- the project's own
        # disclose-don't-hide policy applies to CI tooling too.
        if: always()
        shell: powershell
        run: |
          $appDir = "${{ steps.locate.outputs.app_dir }}"
          Compress-Archive -Path "$appDir\*" -DestinationPath "$env:GITHUB_WORKSPACE\NEXUS_Windows_x64.zip" -Force

      - name: Upload Windows build/launch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-windows-evidence
          path: |
            windows_launch_screenshot.png
            launch_status.txt
            NEXUS_Windows_x64.zip
          if-no-files-found: error
